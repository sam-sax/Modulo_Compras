<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Factura</title>
    <style>
        body, html { margin: 0; padding: 0; padding-top: 70px; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .header-section { background: #27ae60; color: white; padding: 15px 25px; border-bottom: 4px solid #1e8449; }
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
     <div th:replace="~{fragmentos/menu :: menu}"></div>

    <div class="header-section">
        <h2 style="margin:0;">🧾 Registro de Factura de Compra</h2>
    </div>

    <div class="container">
        <div class="form-card">
            <form th:action="@{/compras/facturas/guardar}" method="post">
                <div class="row">
                    <div class="col">
                        <label>Proveedor</label>
                        <select name="proveedorId" required>
                            <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial}"></option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Nro. Factura</label>
                        <input type="text" name="numeroFactura" placeholder="000-000-0000000" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Fecha de Emisión</label>
                        <input type="date" name="fecha" required>
                    </div>
                    <div class="col">
                        <label>Condición</label>
                        <select name="condicion">
                            <option value="CONTADO">CONTADO</option>
                            <option value="CREDITO">CRÉDITO</option>
                        </select>
                    </div>
                </div>

                <h3>Detalle de Artículos</h3>
                <table style="width:100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align:left; border-bottom: 2px solid #eee;">
                            <th>Producto</th>
                            <th width="100">Cantidad</th>
                            <th width="150">Precio Unit.</th>
                            <th width="150">IVA</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>

                <button type="submit" class="btn-save">PROCESAR COMPRA Y CARGAR STOCK</button>
            </form>
        </div>
    </div>
</body>
</html>
