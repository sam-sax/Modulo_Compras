<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Proveedor</title>
    <style>
        body, html { margin: 0; padding: 0; padding-top: 70px; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .container { padding: 20px; display: flex; justify-content: center; }
        .card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; }
        .btn-save:hover { background: #219150; }
        .info-box { background: #e8f4fd; border-left: 4px solid #3498db; padding: 10px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <div class="container">
        <div class="card">
            <h2 style="margin-top:0; color: #2c3e50;">Registrar Nuevo Proveedor</h2>
            <p class="info-box">Seleccione una persona del sistema para habilitarla como proveedor en el módulo de compras.</p>

            <form th:action="@{/compras/proveedores/guardar}" th:object="${proveedorDTO}" method="post">
                <div class="form-group">
                    <label>Seleccionar Persona:</label>
                    <select th:field="*{id}" required>
                        <option value="">-- Seleccione una persona --</option>
                        <option th:each="per : ${personas}" 
                                th:value="${per.id}" 
                                th:text="${per.nombre + ' ' + per.apellido + ' (RUC: ' + per.ruc + ')'}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Razón Social (Opcional):</label>
                    <input type="text" th:field="*{razonSocial}" placeholder="Si es distinto al nombre de la persona">
                </div>

                <div class="form-group">
                    <label>Teléfono de Contacto:</label>
                    <input type="text" th:field="*{telefono}" placeholder="Ej: 0981...">
                </div>

                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" th:field="*{email}" placeholder="proveedor@ejemplo.com">
                </div>

                <button type="submit" class="btn-save">Confirmar y Registrar</button>
                <a th:href="@{/compras/proveedores/vista}" style="display:block; text-align:center; margin-top:15px; color: #7f8c8d; text-decoration:none;">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
