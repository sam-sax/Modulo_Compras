<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Ajustes</title>
    <style>
        /* Requisito: Flush with the top + espacio para el menú fixed */
        body, html {
            margin: 0;
            padding: 0;
            padding-top: 70px; /* Evita que el fragmento tape el contenido */
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }
        .container {
            width: 100%;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-nuevo {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-nuevo:hover {
            background-color: #219150;
        }
        table {
            width: 95%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #eceff1;
            color: #333;
        }
        tr:hover { background-color: #f9f9f9; }
        
        .btn-detalle {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-detalle:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <div class="container">
        <div class="header">
            <h1 style="margin:0;">Ajustes de Stock</h1>
            <a th:href="@{/compras/ajustes/nuevo}" class="btn-nuevo">+ Nuevo Ajuste</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Observación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ajuste : ${ajustes}">
                    <td th:text="${ajuste.id}"></td>
                    <td th:text="${#temporals.format(ajuste.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${ajuste.observacion}"></td>
                    <td>
                        <a th:href="@{/compras/ajustes/detalle/{id}(id=${ajuste.id})}" class="btn-detalle">Ver Detalles</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ajustes)}">
                    <td colspan="4" style="text-align: center; color: #7f8c8d;">No se encontraron registros de ajustes.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
