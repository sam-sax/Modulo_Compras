<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Compras</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .titulo { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .info-reporte { margin: 20px 0; display: flex; justify-content: space-between; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eee; padding: 10px; border: 1px solid #ccc; }
        td { padding: 10px; border: 1px solid #ccc; }
        .total { text-align: right; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>
    <div class="no-print">
        <button onclick="window.print()" style="padding: 10px; cursor:pointer;">🖨️ Imprimir Reporte</button>
        <hr>
    </div>

    <div class="titulo">
        <h2>REPORTE DE ÓRDENES DE COMPRA</h2>
    </div>

    <div class="info-reporte">
        <div><strong>Desde:</strong> <span th:text="${desde}"></span></div>
        <div><strong>Hasta:</strong> <span th:text="${hasta}"></span></div>
        <div><strong>Fecha Emisión:</strong> <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>Estado</th>
                <th>Total (Gs.)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="${o.id}"></td>
                <td th:text="${#temporals.format(o.fecha, 'dd/MM/yyyy')}"></td>
                <td th:text="${o.proveedorNombre}"></td>
                <td th:text="${o.estado}"></td>
                <td th:text="${#numbers.formatDecimal(o.totalFinal, 0, 'POINT', 0, 'COMMA')}" style="text-align: right;"></td>
            </tr>
        </tbody>
    </table>

    <div class="total">
        Total Acumulado: Gs. <span th:text="${#numbers.formatDecimal(totalAcumulado, 0, 'POINT', 0, 'COMMA')}"></span>
    </div>
</body>
</html>
