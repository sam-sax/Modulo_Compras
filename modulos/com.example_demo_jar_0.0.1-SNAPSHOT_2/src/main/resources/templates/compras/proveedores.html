<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Proveedores</title>
    <style>
        /* Requisito: Flush with the top + espacio para menú fixed */
        body, html { 
            margin: 0; 
            padding: 0; 
            padding-top: 70px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f2f2f2; 
        }

        .container {
            padding: 20px;
        }

        h2 { 
            text-align: center; 
            margin-bottom: 25px; 
            color: #2c3e50;
        }

        .actions-bar {
            width: 85%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: flex-end;
        }

        .btn-new {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-new:hover { background-color: #45a049; }

        table { 
            width: 85%; 
            margin: auto; 
            border-collapse: collapse; 
            background-color: #fff; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td { padding: 15px; border: 1px solid #eee; text-align: left; }
        
        th { 
            background-color: #2c3e50; 
            color: white; 
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover { background-color: #f9f9f9; }

        .contact-info {
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <div class="container">
        <h2>Directorio de Proveedores</h2>

        <div class="actions-bar">
            <a th:href="@{/compras/proveedores/nuevo}" class="btn-new">+ Registrar Proveedor</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="50">ID</th>
                    <th>Razón Social</th>
                    <th>RUC / Identificación</th>
                    <th>Contacto (Teléfono)</th>
                    <th>Correo Electrónico</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${proveedores}">
                    <td th:text="${p.id}" style="font-weight: bold; color: #7f8c8d;"></td>
                    <td th:text="${p.razonSocial}" style="font-weight: 500;"></td>
                    <td th:text="${p.ruc}"></td>
                    <td class="contact-info">
                        <span th:text="${p.telefono != null ? p.telefono : 'Sin teléfono'}"></span>
                    </td>
                    <td class="contact-info">
                        <a th:href="'mailto:' + ${p.email}" th:text="${p.email}" style="color: #2980b9; text-decoration: none;"></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(proveedores)}">
                    <td colspan="5" style="text-align: center; padding: 30px; color: #95a5a6;">
                        No hay proveedores registrados en el sistema.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
