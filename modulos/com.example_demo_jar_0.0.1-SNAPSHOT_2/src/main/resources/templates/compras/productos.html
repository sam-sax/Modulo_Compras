<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Productos</title>
    <style>
        /* Requisito: Flush with the top + ajuste para menú global */
        body, html { 
            margin: 0; 
            padding: 0; 
            padding-top: 70px; 
            font-family: 'Segoe UI', sans-serif; 
            background: #f4f7f6; 
        }
        
        /* Sub-barra de navegación interna */
        .sub-navbar { 
            background: #2c3e50; 
            color: white; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .nav-links { display: flex; align-items: center; gap: 20px; }
        
        .nav-links a {
            color: #bdc3c7;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: white; }
        .nav-links a.active { color: white; font-weight: bold; border-bottom: 2px solid #3498db; }

        .container { padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; background: #eceff1; border-bottom: 2px solid #cfd8dc; color: #333; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        /* Estados de Stock */
        .stock-ok { color: #27ae60; font-weight: bold; }
        .stock-low { color: #e74c3c; font-weight: bold; background: #fdf2f2; padding: 4px 8px; border-radius: 4px; }
        
        .btn-action { background: #3498db; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .btn-action:hover { background: #2980b9; }
        
        .btn-new { background: #27ae60; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9rem; font-weight: bold; }
        .btn-new:hover { background: #219150; }

        .alert-success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; border-left: 5px solid #28a745; }
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>

    <div class="sub-navbar">
        <div class="nav-links">
            <h2 style="margin:0; margin-right: 15px; font-size: 1.4rem;">Inventario</h2>
            <a th:href="@{/compras/productos/vista}" class="active">📦 Productos</a>
            <a th:href="@{/compras/categorias/vista}">🏷️ Categorías</a>
            <a th:href="@{/compras/productos/nuevo}" class="btn-new">+ Nuevo Producto</a>
        </div>
        <div style="font-size: 0.9rem; opacity: 0.8;">
            Actualizado: <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span>
        </div>
    </div>

    <div class="container">
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

        <div class="card">
           <table>
    <thead>
        <tr>
            <th>Código</th>
            <th>Descripción</th>
            <th>IVA</th> <th>Categoría</th>
            <th>Stock Actual</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
    </thead>
   <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.codigoBarra}" style="font-family: 'Courier New', monospace;"></td>
        
        <td th:text="${p.nombre}"></td>
        
        <td>
            <span class="badge" 
                  th:text="${p.iva == 0 ? 'Exenta' : p.iva + '%'}"
                  style="background: #eee; padding: 2px 6px; border-radius: 3px; font-size: 0.8rem;">
            </span>
        </td>
        
       <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin Categoría'}"></td>
        
        <td>
            <span th:text="${p.stockActual}" 
                  th:class="${p.stockActual.doubleValue() < 10} ? 'stock-low' : 'stock-ok'">
            </span>
        </td>

        <td>
            <span th:text="${p.activo ? 'Activo' : 'Inactivo'}" 
                  th:style="${p.activo ? 'color: green' : 'color: red'}"></span>
        </td>

        <td>
            <a th:href="@{/compras/productos/editar/{id}(id=${p.id})}" class="btn-action">Editar</a>
        </td>
    </tr>
</tbody>
</table>
        </div>
    </div>
</body>
</html>
