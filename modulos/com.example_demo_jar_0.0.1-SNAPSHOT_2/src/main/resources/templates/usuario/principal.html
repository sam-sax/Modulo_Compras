<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin:0; padding:0; background-color:#f4f7f6; }
        
        .wrapper { display: flex; min-height: 100vh; }

        /* SIDEBAR ACORDEÓN */
        .sidebar-acordeon {
            width: 260px;
            background-color: #2c3e50;
            color: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .acordeon-header {
            padding: 20px;
            background: #1abc9c;
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .acordeon-header:hover { background: #16a085; }

        .acordeon-content {
            background-color: #34495e;
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out;
        }

        .acordeon-content a {
            padding: 12px 25px;
            text-decoration: none;
            font-size: 14px;
            color: #bdc3c7;
            display: block;
            border-bottom: 1px solid #2c3e50;
        }
        .acordeon-content a:hover {
            background-color: #2c3e50;
            color: #1abc9c;
            padding-left: 35px;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content { flex: 1; padding: 40px; }

        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .info-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #4267B2;
            text-align: left;
        }
        
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; line-height: 1.6; }
    </style>
</head>
<body>

<div th:replace="~{fragmentos/menu :: menu}"></div>


    <div class="main-content">
        <div class="welcome-card">
            <h1 th:text="'¡Hola, ' + ${usuarioActual} + '!'">Bienvenido</h1>
            <p th:text="'Has iniciado sesión como: ' + ${rolUsuario}"></p>
            
            <hr style="border:0; border-top:1px solid #eee; margin: 30px 0;">
            
            <div class="info-box">
                <h4 style="margin:0 0 10px 0; color:#4267B2;">💡 Acceso Rápido</h4>
                <p style="margin:0; font-size: 14px;">
                    Para gestionar <b>Clientes</b> y <b>Personas</b>, utiliza el menú azul en la parte superior de la pantalla. 
                    El panel de la izquierda está dedicado exclusivamente a las operaciones de <b>Compras</b>.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // Lógica para abrir/cerrar el acordeón de Compras
    const btn = document.getElementById('toggleCompras');
    const menu = document.getElementById('menuCompras');

    btn.addEventListener('click', () => {
        if (menu.style.maxHeight === '0px') {
            menu.style.maxHeight = '1000px';
        } else {
            menu.style.maxHeight = '0px';
        }
    });
</script>

</body>
</html>
