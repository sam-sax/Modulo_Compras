<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Listado Clientes</title></head>
<body style="font-family: Arial, sans-serif;">
  <div th:replace="~{fragmentos/menu :: menu}"></div>
    <div style="padding: 20px;">
        <div align="center">
        <h1>Gestión de Clientes</h1>
        <div th:if="${error}" style="color:white; background-color:red; padding:10px; width:80%; margin-bottom:10px;" th:text="${error}"></div>
        
        <table width="80%" border="0">
            <tr>
                <td><button onclick="window.location.href='/clientes/nuevo'" style="padding:10px; background-color:#4CAF50; color:white; border:none; cursor:pointer;">+ Registrar Nuevo Cliente</button></td>
                <td align="right"><button onclick="window.location.href='/vendedor/principal'" style="padding:10px;">Volver</button></td>
            </tr>
        </table>
        
        <hr>
        <table border="1" width="80%" cellpadding="10" cellspacing="0">
            <tr bgcolor="#e6e6e6">
                <th>ID</th>
                <th>Nombre / Razón Social</th>
                <th>Documento</th>
                <th>Límite Crédito</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            <tr th:each="c : ${clientes}" align="center">
                <td th:text="${c.id}"></td>
                <td th:text="${c.persona.nombres != null ? c.persona.nombres + ' ' + c.persona.apellidos : c.persona.razonSocial}"></td>
                <td th:text="${c.persona.numeroCedula != null ? c.persona.numeroCedula : c.persona.ruc}"></td>
                <td th:text="${#numbers.formatDecimal(c.limiteCredito, 0, 'POINT', 0, 'COMMA')} + ' Gs.'"></td>
                <td>
                    <b th:text="${c.activo ? 'ACTIVO' : 'INACTIVO'}" th:style="${c.activo ? 'color:green' : 'color:red'}"></b>
                </td>
                <td>
                    <button th:onclick="'window.location.href=\'/clientes/editar/' + ${c.id} + '\''">Editar</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
