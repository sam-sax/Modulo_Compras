<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario</title>
    <style>
        .error { color: red; background-color: #ffe6e6; border: 1px solid red; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { color: green; background-color: #e6ffe6; border: 1px solid green; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input, select { padding: 5px; width: 250px; }
        .required { color: red; }
    </style>
</head>
<body>

<h1>Registrar Usuario (ADMIN/USER)</h1>

<div th:if="${error}" class="error">
    <strong>❌ Error:</strong> <span th:text="${error}"></span>
</div>

<div th:if="${personas == null or personas.empty}" class="error">
    <strong>⚠️ Atención:</strong> No hay personas disponibles para asignar usuario. 
    <a th:href="@{/personas/form}">Registra una persona aquí</a>
</div>

<form th:action="@{/admin/registro}" th:object="${usuarioDTO}" method="post" th:if="${personas != null and not personas.empty}">

    <div class="form-group">
        <label>Usuario: <span class="required">*</span></label>
        <input type="text" th:field="*{usuario}" required>
    </div>

    <div class="form-group">
        <label>Clave: <span class="required">*</span></label>
        <input type="password" th:field="*{clave}" required>
    </div>

    <div class="form-group">
        <label>Rol: <span class="required">*</span></label>
        <select th:field="*{rol}" required>
            <option value="">-- Seleccionar --</option>
            <option value="USER">Usuario (USER)</option>
            <option value="ADMIN">Administrador (ADMIN)</option>
            </select>
    </div>

    <div class="form-group">
        <label>Persona: <span class="required">*</span></label>
        <select th:field="*{personaId}" required>
            <option value="">-- Seleccionar --</option>
            <option th:each="p : ${personas}"
                    th:value="${p.idPersona}"
                    th:text="${p.idPersona + ' - ' + p.nombreMostrable}">
            </option>
        </select>
    </div>

    <div class="form-group">
        <button type="submit">Registrar Usuario</button>
        <a th:href="@{/admin/principal}">Cancelar</a>
    </div>
</form>

</body>
</html>
