<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - Vendedor</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px;">

<table width="100%" border="0" cellspacing="0" cellpadding="20" bgcolor="white" style="border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <tr>
        <td colspan="2" align="center">
            <h1 th:text="'Bienvenido, ' + ${usuarioActual} + ' (' + ${rolUsuario} + ')'" style="color: #333;">Bienvenido!</h1>
            <p style="color: #666;">Sistema de Gestión de Ventas y Compras</p>
            <hr size="1" color="#eeeeee" width="90%">
        </td>
    </tr>
    <tr valign="top">
        <td width="50%" align="center">
            <table border="0" cellpadding="15" cellspacing="0" width="90%" style="border: 1px solid #ddd; margin-bottom: 20px;">
                <tr bgcolor="#e6e6e6">
                    <th align="left">Gestión de Personas</th>
                </tr>
                <tr>
                    <td align="center">
                        <button onclick="window.location.href='/personas/form'"
                                style="width:100%; height:45px; background-color:#4CAF50; color:white; border:none; cursor:pointer; font-weight:bold;">
                            Registrar Persona
                        </button>
                        <div style="margin-top:10px;"></div>
                        <button onclick="window.location.href='/personas/listado'"
                                style="width:100%; height:45px; background-color:#2196F3; color:white; border:none; cursor:pointer; font-weight:bold;">
                            Ver Listado de Personas
                        </button>
                    </td>
                </tr>
            </table>

            <table border="0" cellpadding="15" cellspacing="0" width="90%" style="border: 1px solid #ddd;">
                <tr bgcolor="#e6e6e6">
                    <th align="left">Gestión de Ventas / Clientes</th>
                </tr>
                <tr>
                    <td align="center">
                        <button onclick="window.location.href='/clientes/nuevo'"
                                style="width:100%; height:45px; background-color:#E91E63; color:white; border:none; cursor:pointer; font-weight:bold;">
                            Registrar Cliente
                        </button>
                        <div style="margin-top:10px;"></div>
                        <button onclick="window.location.href='/clientes/listado'"
                                style="width:100%; height:45px; background-color:#9C27B0; color:white; border:none; cursor:pointer; font-weight:bold;">
                            Ver Listado de Clientes
                        </button>
                    </td>
                </tr>
            </table>
        </td>

        <td width="50%" align="center">
            <table border="0" cellpadding="15" cellspacing="0" width="90%" style="border: 1px solid #ddd;">
                <tr bgcolor="#e6e6e6">
                    <th align="left">Gestión de Compras</th>
                </tr>
                <tr>
                    <td align="center">
                        <button onclick="window.location.href='/compras/ordenes/vista'"
                                style="width:100%; height:40px; background-color:#FF9800; color:white; border:none; cursor:pointer; margin-bottom:5px;">
                            Ver Órdenes de Compra
                        </button>
                        <button onclick="window.location.href='/compras/productos/vista'"
                                style="width:100%; height:40px; background-color:#9C27B0; color:white; border:none; cursor:pointer; margin-bottom:5px;">
                            Ver Productos
                        </button>
                        <button onclick="window.location.href='/compras/proveedores/vista'"
                                style="width:100%; height:40px; background-color:#607D8B; color:white; border:none; cursor:pointer; margin-bottom:5px;">
                            Ver Proveedores
                        </button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <br>
            <hr size="1" color="#eeeeee">
            <table cellpadding="10">
                <tr>
                    <td>
                        <button onclick="window.location.href='/usuario/cambiar-contrasena'"
                                style="padding:10px 20px; background-color:#009688; color:white; border:none; cursor:pointer;">
                            Cambiar Contraseña
                        </button>
                    </td>
                    <td>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    style="padding:10px 20px; background-color:#f44336; color:white; border:none; cursor:pointer;">
                                Cerrar Sesión
                            </button>
                        </form>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
