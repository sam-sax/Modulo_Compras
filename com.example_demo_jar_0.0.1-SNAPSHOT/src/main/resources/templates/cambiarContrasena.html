<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #f5f5f5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }

        input[type=password] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background-color: #1976d2;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 15px;
            text-align: center;
        }

        .ok {
            color: green;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cambiar contraseña</h2>

    <form th:action="@{/usuario/cambiar-contrasena}" method="post">
        <label>Contraseña actual:</label>
        <input type="password" name="actual" required>

        <label>Nueva contraseña:</label>
        <input type="password" name="nueva" required>

        <label>Repetir nueva:</label>
        <input type="password" name="repetir" required>

        <button type="submit">Cambiar contraseña</button>
    </form>

    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${mensaje}" th:text="${mensaje}" class="ok"></p>
</div>

</body>
</html>
