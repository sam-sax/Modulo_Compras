<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimientos de Stock</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 90%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Movimientos de Stock de la Orden</h2>

<table>
    <tr>
        <th>Producto ID</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Tipo</th>
        <th>Fecha</th>
        <th>Orden ID</th>
    </tr>
    <tr th:each="mov : ${movimientos}">
        <td th:text="${mov.productoId}"></td>
        <td th:text="${mov.productoNombre != null ? mov.productoNombre : 'SIN NOMBRE'}"></td>
        <td th:text="${mov.cantidad}"></td>
        <td th:text="${mov.tipo}"></td>
        <td th:text="${mov.fecha}"></td>
        <td th:text="${mov.ordenId}"></td>
    </tr>
</table>
</body>
</html>
