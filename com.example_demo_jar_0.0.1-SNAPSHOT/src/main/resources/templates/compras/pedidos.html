<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 80%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Listado de Pedidos</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Proveedor ID</th>
        <th>Subtotal</th>
        <th>IVA</th>
        <th>Total</th>
        <th>Estado</th>
    </tr>
    <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.id}"></td>
        <td th:text="${pedido.fecha}"></td>
        <td th:text="${pedido.proveedorId}"></td>
        <td th:text="${pedido.subtotal}"></td>
        <td th:text="${pedido.iva}"></td>
        <td th:text="${pedido.total}"></td>
        <td th:text="${pedido.estado}"></td>
    </tr>
</table>
</body>
</html>
