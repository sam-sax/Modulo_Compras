<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Órdenes de Compra</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 80%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Listado de Órdenes de Compra</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Proveedor</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Movimientos</th> <!-- nueva columna -->
    </tr>
    <tr th:each="orden : ${ordenes}">
        <td th:text="${orden.id}"></td>
        <td th:text="${orden.proveedorNombre != null ? orden.proveedorNombre : 'SIN PROVEEDOR'}"></td>
        <td th:text="${orden.fecha}"></td>
        <td th:text="${orden.totalFinal}"></td>
        <td th:text="${orden.estado}"></td>
        <td>
            <a th:href="@{/compras/ordenes/{id}/movimientos(id=${orden.id})}">
                Ver Movimientos
            </a>
        </td>
    </tr>
</table>

</body>
</html>
