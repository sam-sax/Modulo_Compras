<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cuentas a Pagar</title></head>
<body>
<h2>Listado de Cuentas a Pagar</h2>
<table>
    <tr>
        <th>ID</th><th>Proveedor</th><th>Fecha Vencimiento</th><th>Estado</th><th>Total</th>
    </tr>
    <tr th:each="cuenta : ${cuentas}">
        <td th:text="${cuenta.id}"></td>
        <td th:text="${cuenta.proveedor.razonSocial}"></td>
        <td th:text="${cuenta.fechaVencimiento}"></td>
        <td th:text="${cuenta.estado}"></td>
        <td th:text="${cuenta.total}"></td>
    </tr>
</table>
</body>
</html>
