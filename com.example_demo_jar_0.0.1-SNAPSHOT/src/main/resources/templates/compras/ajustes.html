<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajustes</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 80%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Listado de Ajustes</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Motivo</th>
        <th>Subtotal</th>
        <th>IVA</th>
        <th>Total</th>
    </tr>
    <tr th:each="ajuste : ${ajustes}">
        <td th:text="${ajuste.id}"></td>
        <td th:text="${ajuste.fecha}"></td>
        <td th:text="${ajuste.motivo}"></td>
        <td th:text="${ajuste.subtotal}"></td>
        <td th:text="${ajuste.iva}"></td>
        <td th:text="${ajuste.total}"></td>
    </tr>
</table>
</body>
</html>
