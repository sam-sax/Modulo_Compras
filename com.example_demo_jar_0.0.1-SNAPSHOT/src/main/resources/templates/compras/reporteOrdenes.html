<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Órdenes de Compra</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 90%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
        .filtro { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Reporte de Órdenes de Compra</h2>

<div class="filtro">
    <form method="get" th:action="@{/compras/ordenes/reporte}">
        Desde: <input type="date" name="desde" th:value="${desde}" />
        Hasta: <input type="date" name="hasta" th:value="${hasta}" />
        Proveedor ID: <input type="number" name="proveedorId" th:value="${proveedorId}" />
        <button type="submit">Filtrar</button>
    </form>
</div>

<table>
    <tr>
        <th>ID</th>
        <th>Proveedor</th>
        <th>Fecha</th>
        <th>Subtotal</th>
        <th>IVA</th>
        <th>Total Final</th>
        <th>Estado</th>
    </tr>
    <tr th:each="orden : ${ordenes}">
        <td th:text="${orden.id}"></td>
        <td th:text="${orden.proveedorNombre != null ? orden.proveedorNombre : 'SIN PROVEEDOR'}"></td>
        <td th:text="${orden.fecha}"></td>
        <td th:text="${orden.subtotal}"></td>
        <td th:text="${orden.iva}"></td>
        <td th:text="${orden.totalFinal}"></td>
        <td th:text="${orden.estado}"></td>
    </tr>
</table>

<h3 style="text-align:center">
    Total acumulado: <span th:text="${totalAcumulado}"></span>
</h3>
</body>
</html>
