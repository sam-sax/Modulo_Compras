<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Presupuestos de Proveedor</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 90%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Listado de Presupuestos de Proveedor</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Proveedor</th>
        <th>Fecha</th>
        <th>Monto</th>
        <th>Observaciones</th>
    </tr>
    <tr th:each="presupuesto : ${presupuestos}">
        <td th:text="${presupuesto.id}"></td>
        <td th:text="${presupuesto.proveedor.razonSocial}"></td>
        <td th:text="${presupuesto.fecha}"></td>
        <td th:text="${presupuesto.monto}"></td>
        <td th:text="${presupuesto.observaciones}"></td>
    </tr>
</table>
</body>
</html>
