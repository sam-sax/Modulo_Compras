<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Usuarios</title>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #f5f5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        /* Contenedor principal del login */
        .login-container {
            max-width: 400px;
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin: 0 0 20px 0;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        .error {
            color: red;
            font-size: 0.85em;
            margin-top: 5px;
        }

        button {
            margin-top: 18px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        button[type="submit"] {
            background-color: #1976d2;
            color: #fff;
        }

        .guest-button {
            background-color: #f0f0f0;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85em;
            color: #666;
        }

        .footer a {
            color: #1976d2;
            text-decoration: none;
            margin: 0 6px;
        }

        /* Botón de cambio de tema fuera del login */
        .theme-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1em;
            color: #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Estilos para modo oscuro */
        body.dark-mode {
            background: linear-gradient(135deg, #121212, #1e1e1e);
            color: #e0e0e0;
        }

        body.dark-mode .login-container {
            background: #1f1f1f;
            border-color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        body.dark-mode h2 {
            color: #fff;
        }

        body.dark-mode label {
            color: #ccc;
        }

        body.dark-mode input {
            background: #2a2a2a;
            color: #fff;
            border-color: #444;
        }

        body.dark-mode .guest-button {
            background: #333;
            color: #fff;
        }

        body.dark-mode .footer {
            color: #aaa;
        }

        body.dark-mode .footer a {
            color: #90caf9;
        }

        body.dark-mode .theme-toggle {
            background: #2a2a2a;
            border-color: #444;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Botón para cambiar entre modo claro y oscuro -->
<button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
    <i class="fa-solid fa-moon"></i>
</button>

<div class="login-container">

    <h2>Iniciar Sesión</h2>

    <form th:action="@{/login}" method="post">
        <label>Usuario:</label>
        <input type="text" name="username" required>
        <div th:if="${param.error}" class="error">
            Usuario o contraseña incorrecta
        </div>

        <label>Contraseña:</label>
        <input type="password" name="password" required>

        <label style="font-weight: normal;">
            <input type="checkbox" name="remember-me"> Recordarme
        </label>

        <button type="submit">Ingresar</button>
    </form>

    <form th:action="@{/invitado}" method="get">
        <button type="submit" class="guest-button">
            Ingresar como Invitado
        </button>
    </form>

    <div class="footer">
        <div>Creado por <strong>Sergio G</strong></div>
        <div style="margin-top: 8px;">
            <a href="https://github.com/sam-sax/Modulo_Compras" target="_blank">
                Código en GitHub
            </a>
            |
            <a href="https://stitch-titanium-ea5.notion.site/LP3-FINAL-TALLER-2cdca1a12ebc80979469cb56c65ac960"
               target="_blank">
                Documentación en Notion
            </a>
        </div>
    </div>

</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");

        document.querySelector(".theme-toggle").innerHTML =
            isDark
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
    }

    window.onload = () => {
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            document.querySelector(".theme-toggle").innerHTML =
                '<i class="fa-solid fa-sun"></i>';
        }
    };
</script>

</body>
</html>
