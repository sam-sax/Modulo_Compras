<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal Admin</title>
    <style>
        /* Estilos conservados exactamente igual */
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 0; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4267B2;
            color: white;
            padding: 15px 30px;
        }
        .header h1 { margin: 0; font-size: 20px; }
        .header .buttons button {
            margin-left: 10px;
            padding: 8px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: white;
            color: #4267B2;
            font-weight: bold;
        }
        .header .buttons button:hover { background-color: #ddd; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        details { border: 1px solid #ccc; padding: 15px; border-radius: 5px; background: #fff; }
        summary { font-size: 18px; cursor: pointer; font-weight: bold; margin-bottom: 10px; color: #333; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }

        .role-badge { 
            color: white; 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        
        .btn-save { background: #4267B2; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-save:hover { background: #365899; }
        .logout-container { text-align: center; margin-bottom: 50px; }
        .logout-btn { padding: 10px 20px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background-color: #d32f2f; }
        
        .status-active { color: #28a745; font-weight: bold; }
        .status-inactive { color: #dc3545; font-weight: bold; }
        .link-action { text-decoration: none; color: #4267B2; font-weight: bold; font-size: 13px; }
        .link-action:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="'Bienvenido, ' + ${nombreCompleto} + '!'">Bienvenido!</h1>

    <div class="buttons">
        <button onclick="window.location.href='/registro'">Registrar Usuario</button>
        <button onclick="window.location.href='/admin/vendedor/nuevo'">Registrar Vendedor</button>
        <button onclick="window.location.href='/admin/vendedor/listado'">Listado de Vendedores</button>
        <button onclick="window.location.href='/personas/form'">Registrar Persona</button>
        <button onclick="window.location.href='/personas/listado'">Ver Listado de Personas</button>
        <button onclick="window.location.href='/usuario/cambiar-contrasena'">Cambiar Contraseña</button>
    </div>
</div>

<div class="container">
    <details open> <summary>Gestión de Usuarios y Accesos</summary>
        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Rol y Rango</th>
                    <th>Estado</th>
                    <th>Persona Asociada</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.usuario}" style="font-weight: bold;"></td>
                    <td>
                        <form th:action="@{/admin/usuarios/cambiar-rol}" method="post" style="display:flex; align-items:center; gap:8px;">
                            <input type="hidden" name="id" th:value="${u.id}"/>
                            <input type="hidden" name="estado" th:value="${u.estado}"/>
                            
                            <span class="role-badge" 
                                  th:style="${u.rol == 'ADMIN' ? 'background:#dc3545' : (u.rol == 'VENDEDOR' ? 'background:#fd7e14' : 'background:#28a745')}"
                                  th:text="${u.rol}">
                            </span>

                            <select name="rol" style="padding: 4px; border-radius: 4px;">
                                <option value="ADMIN" th:selected="${u.rol == 'ADMIN'}">ADMIN</option>
                                <option value="USER" th:selected="${u.rol == 'USER'}">USER</option>
                                <option value="VENDEDOR" th:selected="${u.rol == 'VENDEDOR'}">VENDEDOR</option>
                            </select>
                            <button type="submit" class="btn-save">Guardar</button>
                        </form>
                    </td>
                    <td>
                        <span th:text="${u.estado ? '● Activo' : '○ Inactivo'}" 
                              th:class="${u.estado ? 'status-active' : 'status-inactive'}"></span>
                    </td>
                    <td>
                        <div th:if="${u.nombreCompletoPersona != null}">
                            <span th:text="${u.nombreCompletoPersona}"></span>
                        </div>
                        <span th:unless="${u.nombreCompletoPersona != null}" style="color:#999; font-style: italic;">Sin Persona</span>
                    </td>
                    <td>
                        <a th:if="${u.estado}" 
                           class="link-action" style="color: #f44336;"
                           th:href="@{/admin/usuarios/desactivar/{id}(id=${u.id})}" 
                           onclick="return confirm('¿Desactivar usuario?')">
                           Desactivar
                        </a>
                        <a th:if="${!u.estado}" 
                           class="link-action" style="color: #28a745;"
                           th:href="@{/admin/usuarios/activar/{id}(id=${u.id})}" 
                           onclick="return confirm('¿Activar usuario?')">
                           Activar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </details>
</div>

<div class="logout-container">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Cerrar Sesión de Administrador</button>
    </form>
</div>

</body>
</html>
