<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <style>
        body { font-family: Arial; margin:0; padding:0; background-color:#f2f2f2; }
        .sidebar {
            height: 100%;
            width: 220px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 16px;
            color: #f2f2f2;
            display: block;
        }
        .sidebar a:hover {
            background-color: #575757;
            color: white;
        }
        .content {
            margin-left: 240px; /* espacio para la barra */
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- Barra lateral izquierda: Compras -->
<div class="sidebar">
    <a href="/compras/ordenes/vista">Órdenes</a>
    <a href="/compras/ordenes/reporte">Reporte Órdenes</a>
    <a href="/compras/productos/vista">Productos</a>
    <a href="/compras/proveedores/vista">Proveedores</a>
    <a href="/compras/pedidos/vista">Pedidos</a>
    <a href="/compras/presupuestos/vista">Presupuestos</a>
    <a href="/compras/ajustes/vista">Ajustes</a>
    <a href="/compras/compras/vista">Compras</a>
    <a href="/compras/cuentas/vista">Cuentas</a>
    <a href="/compras/libro/vista">Libro Compras</a>
    <a href="/compras/notas-credito/vista">Notas Crédito</a>
    <a href="/compras/notas-debito/vista">Notas Débito</a>
    <a href="/compras/remisiones/vista">Remisiones</a>
</div>

<!-- Contenido principal -->
<div class="content">
    <table width="100%" border="0" cellspacing="0" cellpadding="20">
        <tr>
            <td colspan="2" align="center">
                <h1 th:text="'Bienvenido, ' + ${usuarioActual} + ' (' + ${rolUsuario} + ')'">Bienvenido!</h1>
                <hr size="2" color="#000000">
            </td>
        </tr>
        <tr valign="top">
            <!-- Columna derecha: Gestión de Personas -->
            <td width="100%" align="center">
                <table border="1" cellpadding="15" cellspacing="0" width="60%">
                    <tr bgcolor="#e6e6e6">
                        <th colspan="2">Gestión de Personas</th>
                    </tr>
                    <tr>
                        <td align="center">
                            <button onclick="window.location.href='/personas/form'"
                                    style="width:200px;height:40px;background-color:#4CAF50;color:white;border:none;cursor:pointer;">
                                Registrar Persona
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                            <button onclick="window.location.href='/personas/listado'"
                                    style="width:200px;height:40px;background-color:#2196F3;color:white;border:none;cursor:pointer;">
                                Ver Listado de Personas
                            </button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <br><br>
                <hr size="1" color="#cccccc">
                <!-- Sección inferior: Configuración y sesión -->
                <table cellpadding="10">
                    <tr>
                        <td>
                            <button onclick="window.location.href='/usuario/cambiar-contrasena'"
                                    style="width:180px;height:35px;background-color:#009688;color:white;border:none;cursor:pointer;">
                                Cambiar Contraseña
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/logout}" method="post" style="display:inline;">
                                <button type="submit"
                                        style="width:180px;height:35px;background-color:#f44336;color:white;border:none;cursor:pointer;">
                                    Cerrar Sesión
                                </button>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
