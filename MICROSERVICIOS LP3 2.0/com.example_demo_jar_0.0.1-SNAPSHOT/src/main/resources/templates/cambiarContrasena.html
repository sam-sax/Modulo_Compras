<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
</head>
<body>
<h1>Cambiar contraseña</h1>

<form th:action="@{/usuario/cambiar-contrasena}" method="post">
    <label>Contraseña actual:</label>
    <input type="password" name="actual" required><br><br>

    <label>Nueva contraseña:</label>
    <input type="password" name="nueva" required><br><br>

    <label>Repetir nueva:</label>
    <input type="password" name="repetir" required><br><br>

    <button type="submit">Cambiar contraseña</button>
</form>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>
<p th:if="${mensaje}" th:text="${mensaje}" style="color:green;"></p>
</body>
</html>
