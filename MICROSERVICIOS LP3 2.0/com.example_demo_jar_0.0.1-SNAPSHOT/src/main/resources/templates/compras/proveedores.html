<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Proveedores</title>
    <style>
        body { font-family: Arial; background-color: #f2f2f2; margin: 50px; }
        table { width: 80%; margin: auto; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        h2 { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Listado de Proveedores</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Razón Social</th>
        <th>RUC</th>
        <th>Teléfono</th>
        <th>Email</th>
    </tr>
    <tr th:each="proveedor : ${proveedores}">
        <td th:text="${proveedor.id}"></td>
        <td th:text="${proveedor.razonSocial}"></td>
        <td th:text="${proveedor.ruc}"></td>
        <td th:text="${proveedor.telefono}"></td>
        <td th:text="${proveedor.email}"></td>
    </tr>
</table>
</body>
</html>
