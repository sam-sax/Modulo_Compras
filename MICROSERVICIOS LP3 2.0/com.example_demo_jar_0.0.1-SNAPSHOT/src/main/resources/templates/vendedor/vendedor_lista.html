<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Vendedores</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #4267B2; color: white; padding: 15px 30px; }
        .header h1 { margin: 0; font-size: 20px; }
        .header .buttons button { margin-left: 10px; padding: 8px 15px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; background-color: white; color: #4267B2; }
        .header .buttons button:hover { background-color: #ddd; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
<div class="header">
    <h1>Listado de Vendedores</h1>
    <div class="buttons">
        <button onclick="window.location.href='/admin/vendedor/nuevo'">Nuevo Vendedor</button>
        <button onclick="window.location.href='/admin/principal'">Panel Principal</button>

    </div>
</div>

<div class="container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Persona</th>
                <th>Código Vendedor</th>
                <th>Usuario</th>
                <th>Activo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${vendedores}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.persona.nombres + ' ' + v.persona.apellidos}"></td>
                <td th:text="${v.codigoVendedor}"></td>
                <td th:text="${v.usuario.usuario}"></td>
                <td th:text="${v.activo ? 'Sí' : 'No'}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
