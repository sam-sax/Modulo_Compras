<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vendedor</title>
</head>
<body>
<h1>Registrar Vendedor</h1>

<!-- Mensajes -->
<div th:if="${error}" style="color:red;">
    <strong>❌ Error:</strong> <span th:text="${error}"></span>
</div>
<div th:if="${mensaje}" style="color:green;">
    <strong>✅ Éxito:</strong> <span th:text="${mensaje}"></span>
</div>

<form th:action="@{/admin/vendedor/guardar}" method="post">
    <label>Usuario: <input type="text" name="usuario" required/></label><br><br>
    <label>Clave: <input type="password" name="clave" required/></label><br><br>
    <label>Persona asociada:
        <select name="personaId" required>
            <option value="">-- Seleccionar persona --</option>
            <option th:each="p : ${personas}"
                    th:value="${p.idPersona}"
                    th:text="${p.idPersona + ' - ' + p.nombres + ' ' + p.apellidos}">
            </option>
        </select>
    </label><br><br>
    <button type="submit">Registrar Vendedor</button>
</form>

<br>
<a th:href="@{/admin/principal}">← Volver al Panel de Administración</a>

</body>
</html>
