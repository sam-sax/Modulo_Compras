<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 50px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4267B2;
            color: white;
            padding: 15px 30px;
        }
        .header h1 { margin: 0; font-size: 20px; }
        .header .buttons button {
            margin-left: 10px;
            padding: 8px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: white;
            color: #4267B2;
        }
        .header .buttons button:hover { background-color: #ddd; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        details { border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
        summary { font-size: 16px; cursor: pointer; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        .logout-btn { margin-top: 20px; padding: 10px 20px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .logout-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="header">
    <h1 th:text="'Bienvenido, ' + ${nombreCompleto} + '!'">Bienvenido!</h1>

    <div class="buttons">
        <button onclick="window.location.href='/registro'">Registrar Usuario</button>
        <button onclick="window.location.href='/admin/vendedor/nuevo'">Registrar Vendedor</button>
        <button onclick="window.location.href='/admin/vendedor/listado'">Listado de Vendedores</button>
        <button onclick="window.location.href='/personas/form'">Registrar Persona</button>
        <button onclick="window.location.href='/personas/listado'">Ver Listado de Personas</button>
        <button onclick="window.location.href='/usuario/cambiar-contrasena'">Cambiar Contraseña</button>
    </div>
</div>

<div class="container">
    <details>
        <summary>Lista de Usuarios</summary>
        <table border="1">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Persona Asociada</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.usuario}"></td>
                    <td>
                        <form th:action="@{/admin/usuarios/cambiar-rol}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${u.id}"/>
                            <input type="hidden" name="estado" th:value="${u.estado}"/>
                            <select name="rol">
                                <option value="ADMIN" th:selected="${u.rol == 'ADMIN'}">ADMIN</option>
                                <option value="USER" th:selected="${u.rol == 'USER'}">USER</option>
                                <option value="VENDEDOR" th:selected="${u.rol == 'VENDEDOR'}">VENDEDOR</option>
                            </select>
                            <button type="submit">Guardar</button>
                        </form>
                    </td>
                    <td th:text="${u.estado ? 'Activo' : 'Inactivo'}"></td>
                    <td th:text="${u.persona != null ? u.persona.nombres + ' (ID: ' + u.persona.idPersona + ')' : 'Sin Persona'}"></td>
                    <td>
                        <a th:if="${u.estado}" 
                           th:href="@{/admin/usuarios/desactivar/{id}(id=${u.id})}" 
                           onclick="return confirm('¿Desactivar usuario?')">
                           Desactivar
                        </a>
                        <a th:if="${!u.estado}" 
                           th:href="@{/admin/usuarios/activar/{id}(id=${u.id})}" 
                           onclick="return confirm('¿Activar usuario?')">
                           Activar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </details>
</div>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="logout-btn">Cerrar Sesión</button>
</form>

</body>
</html>
