<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario</title>
    <style>
        .error {
            color: red;
            background-color: #ffe6e6;
            border: 1px solid red;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            color: green;
            background-color: #e6ffe6;
            border: 1px solid green;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input, select {
            padding: 5px;
            width: 250px;
        }
        .required {
            color: red;
        }
        .warning {
            color: orange;
            font-style: italic;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h1>Registrar Usuario</h1>

<!-- Mostrar errores si existen -->
<div th:if="${error}" class="error">
    <strong>❌ Error:</strong> <span th:text="${error}"></span>
</div>

<!-- Mostrar mensajes de éxito -->
<div th:if="${mensaje}" class="success">
    <strong>✅ Éxito:</strong> <span th:text="${mensaje}"></span>
</div>

<!-- Mostrar advertencia si no hay personas disponibles -->
<div th:if="${personas == null or personas.empty}" class="error">
    <strong>⚠️ Atención:</strong> No hay personas disponibles para asignar usuario. 
    <a th:href="@{/personas/form}">Registra una persona primero</a>
</div>

<!-- Formulario (solo mostrar si hay personas) -->
<form th:action="@{/registro}" method="post" th:if="${personas != null and not personas.empty}">

    <div class="form-group">
        <label for="usuario">Usuario: <span class="required">*</span></label>
        <input type="text" id="usuario" name="usuario" required
               th:class="${#fields.hasErrors('usuario')} ? 'field-error' : ''"
               placeholder="Mínimo 3 caracteres">
        <span class="warning">Debe ser único</span>
    </div>

    <div class="form-group">
        <label for="clave">Clave: <span class="required">*</span></label>
        <input type="password" id="clave" name="clave" required
               placeholder="Mínimo 4 caracteres">
    </div>

    <div class="form-group">
        <label for="rol">Rol: <span class="required">*</span></label>
        <select id="rol" name="rol" required>
            <option value="">-- Seleccionar rol --</option>
            <option value="USER">Usuario (USER)</option>
            <option value="ADMIN">Administrador (ADMIN)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="personaId">Persona asociada: <span class="required">*</span></label>
        <select id="personaId" name="personaId" required>
            <option value="">-- Seleccionar persona --</option>
            <option th:each="p : ${personas}"
                    th:value="${p.idPersona}"
                    th:text="${p.idPersona + ' - ' + p.nombres + ' ' + p.apellidos}">
            </option>
        </select>
        <br>
        <small>Nota: Solo se muestran personas que no tienen usuario asignado</small>
    </div>

    <div class="form-group">
        <button type="submit">Registrar Usuario</button>
        <button type="reset" style="margin-left: 10px;">Limpiar</button>
    </div>

</form>

<hr>
<div>
    <a th:href="@{/admin/principal}">← Volver al Panel de Administración</a> |
    <a th:href="@{/personas/form}">Registrar Nueva Persona</a>
</div>

</body>
</html>
