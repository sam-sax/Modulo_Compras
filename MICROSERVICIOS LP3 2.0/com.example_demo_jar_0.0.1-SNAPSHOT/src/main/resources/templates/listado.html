<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Personas</title>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="10">
    <tr>
        <td align="center">
            <h1>Personas Registradas</h1>
            <hr size="2" color="#000000">
        </td>
    </tr>
    <tr>
        <td>
            <div style="overflow-x:auto;">
                <table border="1" cellpadding="5" cellspacing="0" width="100%">
                    <thead>
                        <tr bgcolor="#e6e6e6">
                            <th>ID</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Cédula</th>
                            <th>RUC</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Email</th>
                            <th>Fecha Nac.</th>
                            <th>Fecha Ingreso</th>
                            <th>Creado por</th>
                            <th>Usuario Vinculado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="persona : ${personas}" align="center">
                            <td th:text="${persona.idPersona}"></td>
                            <td th:text="${persona.nombres}"></td>
                            <td th:text="${persona.apellidos}"></td>
                            <td th:text="${persona.numeroCedula != null ? persona.numeroCedula : '-'}"></td>
                            <td th:text="${persona.ruc != null ? persona.ruc : '-'}"></td>
                            <td th:text="${persona.telefono}"></td>
                            <td th:text="${persona.direccion}"></td>
                            <td th:text="${persona.email != null ? persona.email : '-'}"></td>
                            <td th:text="${persona.fechaNacimiento}"></td>
                            <td th:text="${persona.fechaIngreso}"></td>
                            <td th:text="${persona.usuario != null ? persona.usuario.usuario : 'N/A'}"></td>
                            <td th:text="${persona.usuarioVinculado != null ? persona.usuarioVinculado.usuario + ' (ID: ' + persona.usuarioVinculado.idUsuario + ')' : 'Sin Usuario'}"></td>
                            <td>
                                <!-- CORREGIDO: Usando th:href en lugar de onclick -->
                                <a th:href="@{/personas/editar/{id}(id=${persona.idPersona})}"
                                   style="display:inline-block;width:80px;height:25px;background-color:#FF9800;color:white;border:none;cursor:pointer;font-size:12px;text-align:center;line-height:25px;text-decoration:none;">
                                    Editar
                                </a>
                                <span th:if="${persona.usuarioVinculado == null}">
                                    <a th:href="@{/personas/eliminar/{id}(id=${persona.idPersona})}"
                                       onclick="return confirm('¿Seguro que deseas eliminar?')"
                                       style="display:inline-block;width:80px;height:25px;background-color:#f44336;color:white;border:none;cursor:pointer;font-size:12px;text-align:center;line-height:25px;text-decoration:none;margin-left:5px;">
                                        Eliminar
                                    </a>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </td>
    </tr>
    <tr>
        <td align="center">
            <br>
            <hr size="1" color="#cccccc">
            <table cellpadding="10">
                <tr>
                    <td>
                        <a th:href="@{/personas/form}"
                           style="display:inline-block;width:180px;height:35px;background-color:#4CAF50;color:white;border:none;cursor:pointer;text-align:center;line-height:35px;text-decoration:none;">
                            Nueva Persona
                        </a>
                    </td>
                    <td>
                        <a th:href="@{${linkPrincipal}}"
                           style="display:inline-block;width:150px;height:35px;background-color:#2196F3;color:white;border:none;cursor:pointer;text-align:center;line-height:35px;text-decoration:none;">
                            Volver a Principal
                        </a>
                    </td>
                    <td>
                        <form th:action="@{/logout}" method="post" style="display:inline;">
                            <button type="submit"
                                    style="width:150px;height:35px;background-color:#f44336;color:white;border:none;cursor:pointer;">
                                Cerrar Sesión
                            </button>
                        </form>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
