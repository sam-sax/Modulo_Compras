<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Persona</title>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="20">
    <tr>
        <td align="center">
            <h1>Registro de Personas</h1>
            <h2>Complete todos los campos obligatorios</h2>
            <hr size="2" color="#000000">
        </td>
    </tr>
    <tr>
        <td align="center">
            <form th:action="@{/personas/guardar}" th:object="${persona}" method="post">
                <input type="hidden" th:field="*{idPersona}" />
                
                <table border="1" cellpadding="10" cellspacing="0" width="80%">
                    <tr bgcolor="#e6e6e6">
                        <th colspan="4">Datos Personales</th>
                    </tr>
                    <tr>
                        <td width="25%"><strong>Nombres:</strong></td>
                        <td width="25%">
                            <input type="text" th:field="*{nombres}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{nombres}" style="color:red;"></span>
                        </td>
                        <td width="25%"><strong>Apellidos:</strong></td>
                        <td width="25%">
                            <input type="text" th:field="*{apellidos}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{apellidos}" style="color:red;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Cédula:</strong></td>
                        <td>
                            <input type="text" th:field="*{numeroCedula}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{numeroCedula}" style="color:red;"></span>
                        </td>
                        <td><strong>RUC:</strong></td>
                        <td>
                            <input type="text" th:field="*{ruc}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{ruc}" style="color:red;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Teléfono:</strong></td>
                        <td>
                            <input type="text" th:field="*{telefono}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{telefono}" style="color:red;"></span>
                        </td>
                        <td><strong>Email:</strong></td>
                        <td>
                            <input type="email" th:field="*{email}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{email}" style="color:red;"></span>
                        </td>
                    </tr>
                    
                    <tr bgcolor="#e6e6e6">
                        <th colspan="4">Información de Contacto</th>
                    </tr>
                    <tr>
                        <td><strong>Dirección:</strong></td>
                        <td colspan="3">
                            <input type="text" th:field="*{direccion}" required 
                                   style="width:98%;padding:5px;"/>
                            <br/><span th:errors="*{direccion}" style="color:red;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Ciudad:</strong></td>
                        <td>
                            <input type="text" th:field="*{ciudad}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{ciudad}" style="color:red;"></span>
                        </td>
                        <td><strong>País:</strong></td>
                        <td>
                            <input type="text" th:field="*{pais}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{pais}" style="color:red;"></span>
                        </td>
                    </tr>
                    
                    <tr bgcolor="#e6e6e6">
                        <th colspan="4">Información Personal</th>
                    </tr>
                    <tr>
                        <td><strong>Fecha Nacimiento:</strong></td>
                        <td>
                            <input type="date" th:field="*{fechaNacimiento}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{fechaNacimiento}" style="color:red;"></span>
                        </td>
                        <td><strong>Estado Civil:</strong></td>
                        <td>
                            <input type="text" th:field="*{estadoCivil}" required 
                                   style="width:100%;padding:5px;"/>
                            <br/><span th:errors="*{estadoCivil}" style="color:red;"></span>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="4" align="center" style="padding:20px;">
                            <button type="submit" 
                                    style="width:150px;height:40px;background-color:#4CAF50;color:white;border:none;cursor:pointer;">
                                Guardar Persona
                            </button>
                        </td>
                    </tr>
                </table>
            </form>
        </td>
    </tr>
    <tr>
        <td align="center">
            <br>
            <hr size="1" color="#cccccc">
            <table cellpadding="10">
                <tr>
                    <td>
                        <a th:href="@{${linkPrincipal}}" 
                           style="display:inline-block;width:150px;height:35px;background-color:#2196F3;color:white;border:none;cursor:pointer;text-align:center;line-height:35px;text-decoration:none;">
                            Volver a Principal
                        </a>
                    </td>
                    <td>
                        <form th:action="@{/logout}" method="post" style="display:inline;">
                            <button type="submit"
                                    style="width:150px;height:35px;background-color:#f44336;color:white;border:none;cursor:pointer;">
                                Cerrar Sesión
                            </button>
                        </form>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
